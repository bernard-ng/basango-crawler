[package]
name = "basango"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust-native Basango news crawler with HTML and WordPress adapters"
default-run = "crawler"

[[bin]]
name = "crawler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bullmq = { version = "1.2.5", package = "bullmq-official" }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
html2md = "0.2.15"
httpdate = "1.0.3"
md5 = "0.8.0"
rand = "0.9.2"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager", "script"] }
regex = "1.11.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
scraper = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
zod-rs = { version = "1.0.1", default-features = false }

[dev-dependencies]
tempfile = "3.23.0"
